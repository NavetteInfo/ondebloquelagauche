name: Relevé

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relire les trois API
        run: python3 refresh.py
      - name: Garder un relevé complet
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("data/fiches.json").read_text(encoding="utf-8"))
          source = str(doc.get("source") or "")
          count = doc.get("fiche_count")
          if "accounts.js" not in source or not isinstance(count, int) or count < 1000:
              raise SystemExit(f"relevé incomplet source={source} fiches={count}")
          print(f"fiches={count} total={doc.get('total_blocks')} as_of={doc.get('as_of')}")
          PY
      - name: Publier le relevé
        run: |
          git config user.name "Navette"
          git config user.email "253750988+NavetteInfo@users.noreply.github.com"
          git add data/fiches.json data/submissions.json data/comparaison.json data/historique
          if git diff --cached --quiet; then
            echo "aucun changement"
            exit 0
          fi
          git commit -m "Relève les trois API."
          git push
